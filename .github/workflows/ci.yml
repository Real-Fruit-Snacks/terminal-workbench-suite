name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test vscode port
        working-directory: ports/vscode
        run: node --test
      - name: Verify vscode committed artifacts
        working-directory: ports/vscode
        run: |
          node build/build.js
          git diff --exit-code -- .
      - name: Verify brave committed artifacts
        working-directory: ports/brave
        run: |
          node build.mjs
          git diff --exit-code -- .
