name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test vscode port
        working-directory: ports/vscode
        run: node --test
      - name: Verify vscode committed artifacts
        working-directory: ports/vscode
        run: |
          node build/build.js
          git diff --exit-code -- .
      - name: Verify brave committed artifacts
        working-directory: ports/brave
        run: |
          node build.mjs
          git diff --exit-code -- .
      - name: Validate port data files
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const walk = d => fs.readdirSync(d, {withFileTypes:true}).flatMap(e => e.isDirectory() ? walk(path.join(d, e.name)) : path.join(d, e.name));
            const files = walk("ports").filter(f => f.endsWith(".json"));
            files.forEach(f => { JSON.parse(fs.readFileSync(f, "utf8")); });
            console.log("parsed " + files.length + " JSON files");
          '
          node --check ports/codemirror/terminal-workbench.mjs
          node --check ports/xtermjs/index.mjs
