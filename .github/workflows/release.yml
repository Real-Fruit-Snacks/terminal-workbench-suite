name: Release

on:
  push:
    tags: ["v*"]
  # Manual path, for when pushing a tag from a workstation isn't possible.
  # Creates the tag at the checked-out commit as part of publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # On a tag push this is the pushed tag; on dispatch it is the input.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with 'v' (got '$RELEASE_TAG')" >&2; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists" >&2; exit 1
          fi
          # On dispatch the tag is created from $GITHUB_SHA. If it already
          # exists, GitHub ignores --target and would publish at whatever
          # commit the tag points to, so refuse rather than release the
          # wrong tree.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
             git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists — push it to release, or pick a new version" >&2
            exit 1
          fi
          echo "Releasing $RELEASE_TAG from $GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test vscode port
        working-directory: ports/vscode
        run: node --test
      - name: Verify vscode committed artifacts
        working-directory: ports/vscode
        run: |
          node build/build.js
          git diff --exit-code -- .
      - name: Verify brave committed artifacts
        working-directory: ports/brave
        run: |
          node build.mjs
          git diff --exit-code -- .
      - name: Verify firefox committed artifacts
        working-directory: ports/firefox
        run: |
          node build.mjs
          git diff --exit-code -- .
      - name: Verify ANSI palette across ports
        run: node tools/verify-palette.mjs
      - name: Package vsix
        working-directory: ports/vscode
        run: |
          cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
          npx --yes @vscode/vsce package --no-dependencies --readme-path build/vsix-readme.md
      - name: Assemble release assets
        run: |
          mkdir -p out
          (cd ports/vim && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-vim.zip" autoload colors README.md)
          (cd ports/brave && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-brave.zip" dist README.md)
          (cd ports/notepad-plus-plus && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-notepad-plus-plus.zip" "Terminal Workbench Dark.xml" "Terminal Workbench Light.xml" README.md)
          cp ports/windows-terminal/terminal-workbench.json out/terminal-workbench-windows-terminal.json
          (cd font && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-mono.zip" dist OFL.txt README.md)
          (cd ports/neovim && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-neovim.zip" colors lua README.md)
          (cd ports/terminals && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-terminals.zip" .)
          (cd ports/tmtheme && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-tmtheme.zip" .)
          (cd ports/zed && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-zed.zip" .)
          (cd ports/helix && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-helix.zip" .)
          (cd ports/jetbrains && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-jetbrains.zip" .)
          (cd ports/xtermjs && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-xtermjs.zip" .)
          (cd ports/codemirror && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-codemirror.zip" .)
          (cd ports/firefox && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-firefox.zip" terminal-workbench-dark terminal-workbench-light README.md)
          (cd ports/wireshark && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-wireshark.zip" .)
          (cd ports/shell && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-shell.zip" .)
          (cd ports/notesnook && zip -r "$GITHUB_WORKSPACE/out/terminal-workbench-notesnook.zip" terminal-workbench-dark.json terminal-workbench-light.json README.md)
          cp ports/vscode/*.vsix out/
          ls -l out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # The tag does not exist yet — create it at the commit just built.
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes out/*
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes out/*
          fi
