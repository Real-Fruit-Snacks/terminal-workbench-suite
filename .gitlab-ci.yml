# GitLab Pages deployment for the Terminal Workbench suite.
# Publishes the demo site on every push to the default branch.
# No build step — the site is served as-is from the repo files.

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public/tokens public/docs/assets public/font/dist/webfonts
    - cp index.html THEME-SPEC.md LICENSE public/
    - cp tokens/tokens.css tokens/fonts.css public/tokens/
    - cp docs/assets/*.svg public/docs/assets/
    - cp font/dist/webfonts/*.woff2 public/font/dist/webfonts/
    - for f in ports/*/docs/assets/cover-*.svg font/docs/assets/cover-*.svg; do mkdir -p "public/$(dirname "$f")"; cp "$f" "public/$f"; done
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
